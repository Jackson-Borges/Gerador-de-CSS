<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="https://cdn.iconscout.com/icon/premium/png-512-thumb/raio-icon-svg-download-png-13239714.png?f=webp&w=512" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>Gerador</title>
</head>
<body>
    <h1>Gerador de CSS <span> com IA </span>⚡</h1>
    <p>Use está área para escreve qual tipo de imagem o CSS irá realizar para você</p>
    <textarea class="caixa-texto" rows="3" placeholder="Ex: Digite Aqui"></textarea>
    <button class="botao-gerar">Gerar Código</button>
    <section class="painel-resultados">
        <div class="resultado">
            <h2>Código</h2>
            <pre class="bloco-codigo"><code></code></pre>
        </div>
        <div class="resultado">
            <h2>Preview</h2>
            <iframe class="resultado-codigo" title="Preview do código gerado"></iframe>
        </div>
    </section>
</body>
<script src="scripts.js">

</script>
</html>
